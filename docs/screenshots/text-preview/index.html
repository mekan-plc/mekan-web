<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Body text comparison</title>
<style>
  body { margin: 0; background: #ffffff; color: #111111; font: 15px/1.6 Inter, Arial, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font: 600 26px/1.2 Georgia, serif; color: #0f2c59; margin: 0 0 8px; }
  h2 { font: 600 18px/1.3 Georgia, serif; color: #0f2c59; margin: 32px 0 4px; }
  p { margin: 0 0 10px; color: #5e5e5e; max-width: 75ch; }
  img { display: block; width: 100%; height: auto; border: 1px solid #e6e6e1; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1>Body text: light now vs full black</h1>
  <p>Only the paragraph colour changes. Look at the two About paragraphs on the left.</p>

  <h2>1 · Light mode now: black at 85%, #343434 (11.9 : 1)</h2>
  <img src="1-light-now.jpg" alt="Light mode, body text at 85% black">

  <h2>2 · Light mode, full black: #111111 (18.1 : 1)</h2>
  <img src="2-light-full-black.jpg" alt="Light mode, body text in full black">

  <h2>3 · Dark mode now, for reference: light text at 85%, #D2D2CF (13.0 : 1)</h2>
  <img src="3-dark-now.jpg" alt="Dark mode, body text at 85% light">
</main>
</body>
</html>
